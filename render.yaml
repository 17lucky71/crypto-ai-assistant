# Render Blueprint (선택). 대시보드에서 직접 만들어도 된다.
services:
  - type: web
    name: crypto-ai-assistant-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: OPENAI_MODEL
        value: gemini-2.5-flash
      - key: OPENAI_MAX_TOKENS
        value: "1500"
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: ALERT_TOKEN
        sync: false
      - key: ALERT_MODE
        value: change
