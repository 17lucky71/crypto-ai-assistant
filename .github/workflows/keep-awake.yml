# Render 무료 서버는 15분 동안 요청이 없으면 잠들어 첫 접속이 최대 1분 걸린다.
# 낮 시간(한국 07:00~23:00)에는 10분마다 상태 확인 요청을 보내 서버를 깨어 있게 한다.
# (GitHub 예약 실행은 몇 분 늦게 시작될 수 있다.)
name: 서버 깨어 있게 하기

on:
  schedule:
    - cron: "*/10 22-23 * * *"   # UTC 22~23시 = 한국 07~08시
    - cron: "*/10 0-13 * * *"    # UTC 00~13시 = 한국 09~22시
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 상태 확인 요청
        run: |
          URL="${{ vars.API_URL || 'https://crypto-ai-assistant-j7ge.onrender.com' }}/"
          for i in 1 2 3 4 5 6; do
            if curl -sf --max-time 25 "$URL" > /dev/null; then echo "서버 깨어 있음"; exit 0; fi
            echo "응답 대기... ($i)"; sleep 10
          done
          echo "서버가 응답하지 않습니다"; exit 1
